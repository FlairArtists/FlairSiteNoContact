<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Tanush — Wedding &amp; Social Events · Flair Artists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #0A0906; }
    html, body { overflow-x: hidden; }
    *, *::before, *::after { box-sizing: border-box; }
    h1, h2, h3 { overflow-wrap: normal; word-break: normal; hyphens: none; min-width: 0; }
    @media (max-width: 480px) { nav img { width: 80px !important; height: 29px !important; } }
    body { font-family: 'Archivo', sans-serif; }
    a { color: #F1E8D5; }
    a:hover { color: #D4A650; }
    ::selection { background: #D4A650; color: #1A1206; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</helmet>

<div data-screen-label="Tanush — Wedding and Social Events" style="min-height: 100vh; background: #0A0906; color: #F1E8D5; font-family: Archivo, sans-serif;">

  <nav style="position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 14px clamp(20px, 5vw, 64px); background: rgba(6,5,3,0.88); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(241,232,213,0.12);">
    <a href="Home.dc.html" style="text-decoration: none; font-weight: 900; font-stretch: 125%; text-transform: uppercase; font-size: 17px; letter-spacing: 0.02em; color: #F1E8D5;"><img src="uploads/pasted-1784257401805-0.png" alt="Flair Artists &amp; Entertainment" style="display: block; width: 116px; height: 42px; object-fit: contain; object-position: left center;"></a>
    <div style="display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; font-family: Archivo, sans-serif; font-size: 12px; letter-spacing: 0.08em;">
      <a href="Main Artists.dc.html" style="text-decoration: none; color: #D4A650;">Exclusives</a>
    </div>
  </nav>

  <header style="position: relative; overflow: hidden; background: #060503; padding: clamp(40px, 7vw, 80px) clamp(20px, 5vw, 64px) clamp(32px, 4vw, 48px);">
    <a href="IP - Tanush.dc.html" style="position: relative; display: inline-flex; align-items: center; gap: 6px; margin: 0 0 18px; background: none; border: none; padding: 0; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: rgba(241,232,213,0.85); text-decoration: none;" style-hover="color: #D4A650;">← BACK</a>
    <p style="position: relative; margin: 0 0 24px; animation: riseIn 0.6s cubic-bezier(0.22,1,0.36,1) both; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em;"><a href="Main Artists.dc.html" style="color: rgba(241,232,213,0.85); text-decoration: none;" style-hover="color: #D4A650;">ROSTER</a><span style="color: rgba(241,232,213,0.85);"> / </span><a href="Artist - Yashraj Kapil.dc.html" style="color: rgba(241,232,213,0.85); text-decoration: none;" style-hover="color: #D4A650;">YASHRAAJ KAPIL</a><span style="color: rgba(241,232,213,0.85);"> / </span><a href="IP - Tanush.dc.html" style="color: rgba(241,232,213,0.85); text-decoration: none;" style-hover="color: #D4A650;">TANUSH</a><span style="color: rgba(241,232,213,0.85);"> / </span><span style="color: #D4A650;">WEDDING AND SOCIAL EVENTS</span></p>
    <div style="position: relative; display: flex; flex-direction: column; gap: 20px;">
      <h1 style="margin: 0; font-weight: 900; font-stretch: 125%; text-transform: uppercase; font-size: clamp(26px, 4.6vw, 84px); line-height: 0.94; letter-spacing: -0.01em; background: linear-gradient(100deg, #F1E8D5 0%, #EFCE8C 35%, #D4A650 62%, #F6ECD2 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: riseIn 0.8s cubic-bezier(0.22,1,0.36,1) 0.1s both; text-wrap: balance;">Tanush<br><span style="font-size: 0.55em;">Wedding &amp; Social Events</span></h1>
    </div>
  </header>

  <section data-screen-label="Tanush — Wedding and Social Events — videos" style="padding: clamp(40px, 6vw, 72px) 0 clamp(64px, 9vw, 110px);">
    <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; padding: 0 clamp(20px, 5vw, 64px); margin-bottom: 24px;">
      <h2 style="margin: 0; font-weight: 900; font-stretch: 125%; text-transform: uppercase; font-size: clamp(18px, 3.4vw, 34px);">All Performances</h2>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 20px; padding: 0 clamp(20px, 5vw, 64px);">
      <sc-for list="{{ clips }}" as="c" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div onClick="{{ c.onClick }}" style="position: relative; aspect-ratio: 16 / 9; border: 1px solid rgba(241,232,213,0.14); overflow: hidden; background: repeating-linear-gradient(135deg, #1B160F 0 10px, #110D08 10px 20px); cursor: pointer; display: flex; align-items: center; justify-content: center;" style-hover="border: 1px solid rgba(212,166,80,0.7);">
            <sc-if value="{{ c.thumb }}" hint-placeholder-val="{{ false }}">
              <img src="{{ c.thumb }}" alt="{{ c.label }}" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
            </sc-if>
            <span style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: rgba(6,5,3,0.75); border: 1px solid rgba(212,166,80,0.8); color: #D4A650; padding-left: 3px;"><svg width="14" height="16" viewBox="0 0 14 16" fill="currentColor"><path d="M0 0 L14 8 L0 16 Z"></path></svg></span>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <sc-if value="{{ activeVideo }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeVideo }}" style="position: fixed; inset: 0; z-index: 100; background: rgba(6,5,3,0.92); display: flex; align-items: center; justify-content: center; padding: clamp(16px, 4vw, 48px);">
      <div onClick="{{ stopClick }}" style="position: relative; width: 100%; max-width: 1040px; aspect-ratio: 16 / 9;">
        <button onClick="{{ closeVideo }}" style="position: absolute; top: -44px; right: 0; background: none; border: none; color: #F1E8D5; font-size: 30px; line-height: 1; cursor: pointer; font-family: 'IBM Plex Mono', monospace;">×</button>
        <iframe src="{{ activeVideoSrc }}" title="Clip" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen="{{ true }}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 1px solid rgba(212,166,80,0.5); background: #000;"></iframe>
      </div>
    </div>
  </sc-if>

  <footer data-screen-label="Footer" style="border-top: 1px solid rgba(241,232,213,0.14); background: #060503; padding: clamp(40px, 6vw, 72px) clamp(20px, 5vw, 64px); display: flex; flex-direction: column; gap: 36px;">
    <div style="display: flex; flex-wrap: wrap; gap: 36px; justify-content: space-between; align-items: flex-start;">
      <div style="display: flex; flex-direction: column; gap: 12px; min-width: 220px; margin-left: 8px;">
        <img src="uploads/pasted-1784257401805-0.png" alt="Flair Artists &amp; Entertainment" style="display: block; width: 190px; height: 70px; object-fit: contain; object-position: left center;">
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid rgba(241,232,213,0.1); padding-top: 18px; font-family: Archivo, sans-serif; font-size: 11px; letter-spacing: 0.06em; color: rgba(241,232,213,0.85);">
      <span>EST 2024 · FLAIR ARTISTS &amp; ENTERTAINMENT</span>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {},
  &quot;playlistId&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;PLBNw4JPDP7Q0&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Videos&quot; },
  &quot;videoCount&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 9, &quot;min&quot;: 2, &quot;max&quot;: 24, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Videos&quot;, &quot;label&quot;: &quot;Fallback tile count&quot; }
}">
class Component extends DCLogic {
  state = { live: null, activeVideo: null };

  openVideo = (src) => this.setState({ activeVideo: src });
  closeVideo = () => this.setState({ activeVideo: null });
  stopClick = (e) => e.stopPropagation();


  componentDidMount() {
    const list = this.props.playlistId ?? "PLBNw4JPDP7Q0";
    import("./playlist.js")
      .then((m) => m.fetchPlaylist(list, 24))
      .then((items) => { if (items && items.length) this.setState({ live: items }); })
      .catch(() => {});
  }

  renderVals() {
    const list = this.props.playlistId ?? "PLBNw4JPDP7Q0";
    const live = this.state.live;

    if (live) {
      return {
        clips: live.map((v) => {
          const modalSrc = "https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1&rel=0&modestbranding=1";
          return {
            thumb: v.thumb || ("https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg"),
            label: v.title || ("CLIP " + String((v.position || 0) + 1).padStart(2, "0")),
            onClick: () => this.openVideo(modalSrc)
          };
        }),
        clipCountLabel: live.length + " CLIPS · AUTO-SYNCED",
        activeVideo: this.state.activeVideo,
        activeVideoSrc: this.state.activeVideo || "",
        closeVideo: this.closeVideo,
        stopClick: this.stopClick
      };
    }

    // Fallback until a key/endpoint is configured: address videos by playlist position.
    const n = this.props.videoCount ?? 9;
    const clips = [];
    for (let i = 1; i <= n; i++) {
      const modalSrc = "https://www.youtube-nocookie.com/embed/videoseries?list=" + list + "&index=" + i + "&autoplay=1&rel=0&modestbranding=1";
      clips.push({
        thumb: null,
        label: "CLIP " + String(i).padStart(2, "0"),
        onClick: () => this.openVideo(modalSrc)
      });
    }
    return {
      clips: clips,
      clipCountLabel: n + " CLIPS",
      activeVideo: this.state.activeVideo,
      activeVideoSrc: this.state.activeVideo || "",
      closeVideo: this.closeVideo,
      stopClick: this.stopClick
    };
  }
}
</script>
</body>
</html>
